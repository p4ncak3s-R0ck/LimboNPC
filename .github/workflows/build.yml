name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26", "1.21", "1.20"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build -PminecraftVersion=${{ matrix.minecraft }}

      - name: Verify artifacts
        run: |
          test -f limbo/build/libs/LimboNPC-Limbo-${{ matrix.minecraft }}.jar
          test -f velocity/build/libs/LimboNPC-Velocity-${{ matrix.minecraft }}.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LimboNPC-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            limbo/build/libs/LimboNPC-Limbo-${{ matrix.minecraft }}.jar
            velocity/build/libs/LimboNPC-Velocity-${{ matrix.minecraft }}.jar

  nightly:
    name: Update Nightly Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LimboNPC-*
          path: artifacts
          merge-multiple: true

      - name: Update Nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            artifacts/LimboNPC-Limbo-26.jar
            artifacts/LimboNPC-Velocity-26.jar
            artifacts/LimboNPC-Limbo-1.21.jar
            artifacts/LimboNPC-Velocity-1.21.jar
            artifacts/LimboNPC-Limbo-1.20.jar
            artifacts/LimboNPC-Velocity-1.20.jar
