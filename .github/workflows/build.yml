name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26", "1.21", "1.20"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew clean build -PminecraftVersion=${{ matrix.minecraft }}

      - name: Runtime integration smoke test
        if: matrix.minecraft == '26'
        run: ./scripts/integration-smoke.sh

      - name: Verify artifacts
        run: |
          test -f limbo/build/libs/LimboNPC-Limbo-${{ matrix.minecraft }}.jar
          test -f velocity/build/libs/LimboNPC-Velocity-${{ matrix.minecraft }}.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LimboNPC-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            limbo/build/libs/LimboNPC-Limbo-${{ matrix.minecraft }}.jar
            velocity/build/libs/LimboNPC-Velocity-${{ matrix.minecraft }}.jar
